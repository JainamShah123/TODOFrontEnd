server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Task attachments are up to 5 MB; nginx's default 1 MB limit would reject them.
    client_max_body_size 10m;

    location ~ ^/(api|uploads)/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built JS/CSS have a content hash in their names, so a new deploy gets new URLs: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker scripts must never be cached, or a browser can keep running an old one.
    location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # nginx's default MIME list doesn't know .webmanifest; browsers want this type to install the app.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are handled by the React router. index.html is always revalidated,
    # so every page load picks up the latest asset URLs.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
